# 面向单条 SRS/原子级需求的澄清问题集
# 仅基于当前这条原始需求作答，不得发明与本条无关的产品或功能。

# 目标用户：适用于本条需求涉及的用户角色
- id: target_user
  phase: 1
  dimension: user
  optional: true
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    本条需求主要面向哪些用户角色或使用场景？若有，请简要描述；若从表述中无法推断则回答「未明确」。用简体中文回答。

# 系统约束：技术、环境或合规约束
- id: system_constraints
  phase: 1
  dimension: constraints
  optional: true
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    本条需求是否有技术约束、环境限制、合规要求或性能边界？若有，请列出；若无则回答「无」。用简体中文回答。

- id: constraint_type
  phase: 1
  dimension: type
  optional: false
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    请判断该条需求属于哪一类并简要说明依据：A. 功能需求 B. 非功能需求（性能/安全/可用性等） C. 技术约束/依赖 D. 接口或集成要求 E. 其他（请说明）。用简体中文回答。

- id: dependency_system
  phase: 1
  dimension: dependency
  optional: false
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    本条需求是否依赖特定系统、工具、平台或第三方？若有，请列出并说明在本条中的角色；若无则回答「无」。用简体中文回答。

- id: acceptance_criteria
  phase: 2
  dimension: acceptance
  optional: false
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    如何验证本条需求是否被满足？请给出可检验的验收条件或测试要点（1～3 条即可）。用简体中文回答。

- id: terminology
  phase: 2
  dimension: terminology
  optional: true
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    本条中是否有需要澄清的专有名词、缩写或技术术语？若有请逐一简要解释；若无则回答「无」。用简体中文回答。

- id: applicable_subsystem
  phase: 2
  dimension: scope
  optional: true
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    本条需求适用于系统的哪个部分或模块（如：门户、存储、认证、某业务模块等）？若从表述中无法推断则回答「未明确」。用简体中文回答。

- id: priority_optionality
  phase: 3
  dimension: priority
  optional: true
  prompt: |
    【约束】仅基于下面这条原始需求作答，不得发明与本条无关的产品或功能。
    原始需求：{requirement}
    本条需求在实现上的优先级或可选性：Must Have（必须）/ Should Have（应该）/ Nice to Have（可选），并简述理由。用简体中文回答。
